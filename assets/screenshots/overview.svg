      <stop offset="0.45" stop-color="#3b2350"/>
      <stop offset="0.72" stop-color="#7a3b63"/>
      <stop offset="1" stop-color="#e08a5a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
