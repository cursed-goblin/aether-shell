# ---------------------------------------------------------------------------
# Aether Shell - keybinds
#   source = /usr/share/aether-shell/config/hyprland/keybinds.conf
# ---------------------------------------------------------------------------

$mod = SUPER

# Shell surfaces
bind = $mod, SPACE,  exec, astal -i aether toggle launcher
bind = $mod, A,      exec, astal -i aether toggle ai
bind = $mod, C,      exec, astal -i aether toggle control-center
bind = $mod SHIFT, R, exec, astal -i aether reload

# Ask the agent about whatever is on the clipboard, no window needed
bind = $mod, Q, exec, astal -i aether ai "Explain this: $(wl-paste)"

# Autostart
exec-once = aether-shell

# Media / brightness keys drive the OSD
bindl  = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl  = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
