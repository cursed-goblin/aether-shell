# ---------------------------------------------------------------------------
# Aether Shell - compositor blur
#
# READ THIS: GTK4 CSS has NO backdrop-filter. The translucency in the
# stylesheet is only half of glassmorphism - the actual blur behind each
# surface is produced by the compositor. Without these rules the shell looks
# like flat grey panels.
#
# Add to hyprland.conf:
#   source = /usr/share/aether-shell/config/hyprland/blur.conf
# ---------------------------------------------------------------------------

decoration {
    rounding = 14

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.015
        contrast = 1.05
        brightness = 0.92
        popups = true
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(00000060)
    }

    active_opacity = 1.0
    inactive_opacity = 0.97
}

# Blur every Aether layer surface. The namespaces below must match the
# `namespace=` prop on each window in widget/**.tsx.
layerrule = blur, aether-bar
layerrule = blur, aether-dock
layerrule = blur, aether-launcher
layerrule = blur, aether-control-center
layerrule = blur, aether-ai
layerrule = blur, aether-notifications
layerrule = blur, aether-osd

# ignorealpha keeps fully transparent padding from being blurred, which is
# what stops the panels from looking like foggy rectangles.
layerrule = ignorealpha 0.2, aether-bar
layerrule = ignorealpha 0.2, aether-dock
layerrule = ignorealpha 0.2, aether-launcher
layerrule = ignorealpha 0.2, aether-control-center
layerrule = ignorealpha 0.2, aether-ai
layerrule = ignorealpha 0.2, aether-notifications
layerrule = ignorealpha 0.2, aether-osd

# Entrance animations for the overlay surfaces.
layerrule = animation slide top, aether-bar
layerrule = animation slide bottom, aether-dock
layerrule = animation popin 92%, aether-launcher
layerrule = animation slide right, aether-control-center
layerrule = animation slide right, aether-ai
layerrule = animation slide right, aether-notifications
layerrule = animation popin 88%, aether-osd
